# Gmail organiser stack. Copy .env.example to .env, then: docker compose up -d --build
# To run published images instead, set API_IMAGE/WEB_IMAGE, then: docker compose pull && docker compose up -d
# Only `web` is published (on 127.0.0.1); `api` and `db` stay on the compose network.
name: gmail-organiser

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gmo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gmail_organiser}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: ${API_IMAGE:-gmail-organiser-api:local}
    build:
      context: .
      dockerfile: src/api/Dockerfile
      args:
        # true adds the Claude Code CLI for headless Claude reviews (about +480 MB).
        WITH_CLAUDE: ${WITH_CLAUDE:-false}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-gmail_organiser};Username=${POSTGRES_USER:-gmo};Password=${POSTGRES_PASSWORD:-gmo_dev_password}
      DataProtection__KeysPath: /keys
      Security__AllowedOrigins__0: http://localhost:${WEB_PORT:-5180}
      Security__AllowedOrigins__1: http://127.0.0.1:${WEB_PORT:-5180}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${WEB_PORT:-5180}}
      GMAIL_FAKE: ${GMAIL_FAKE:-false}
      LLM_FAKE: ${LLM_FAKE:-false}
      # From `claude setup-token`; only the Claude Code CLI reads it (inherited by its process), the api never logs it.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Attachment reading (not on the Settings page); the defaults match the code's.
      Attachments__ImageTimeout: ${Attachments__ImageTimeout:-}
      Attachments__MaxOcrPages: ${Attachments__MaxOcrPages:-3}
      Attachments__OcrLanguages: ${Attachments__OcrLanguages:-eng}
      Attachments__OcrMemoryLimitMb: ${Attachments__OcrMemoryLimitMb:-1024}
      Attachments__MaxSheetRows: ${Attachments__MaxSheetRows:-200}
      Attachments__MaxTotalChars: ${Attachments__MaxTotalChars:-12000}
    extra_hosts:
      # Docker Desktop resolves this itself; Linux needs the mapping to reach Ollama on the host.
      - "host.docker.internal:host-gateway"
    volumes:
      # Data Protection key ring (encrypts the Google refresh token and client secret).
      - dp-keys:/keys
    healthcheck:
      # The runtime image has no curl/wget: plain HTTP over bash /dev/tcp. Host `localhost` passes
      # AllowedHosts; /healthz includes the database check, so healthy means migrated and connected.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    image: ${WEB_IMAGE:-gmail-organiser-web:local}
    build:
      context: src/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  db-data:
  dp-keys:
